name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  pull_request:
    branches: [main]
    paths: ["frontend/**"]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Check generated code freshness (orval)
        run: |
          pnpm gen:api
          git diff --exit-code src/api/generated || (echo "Generated code is stale. Run 'pnpm gen:api' and commit." && exit 1)

      # Offline check: types must match the committed schema (no network dependency)
      - name: Types match committed schema
        run: |
          npx openapi-typescript docs/api/openapi.yml -o /tmp/api.d.ts
          diff -q /tmp/api.d.ts src/types/api.d.ts || (echo "Types are stale vs committed schema. Run 'pnpm gen:types' and commit." && exit 1)

      - name: Typecheck
        run: pnpm typecheck
        timeout-minutes: 5

      - name: Lint
        run: pnpm lint
        timeout-minutes: 5

      - name: Tests
        run: pnpm test
        timeout-minutes: 5

      - name: Build
        run: pnpm build
        timeout-minutes: 5

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
