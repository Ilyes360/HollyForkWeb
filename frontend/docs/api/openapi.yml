openapi: 3.0.3
info:
  title: Holly Pi API
  version: 1.0.0
  description: |-
    Documentation OpenAPI 3 des endpoints : corps de requête/réponse JSON, en-têtes, authentification JWT.

    **Impression** : groupe « Impression » dans Swagger — découverte réseau (`GET /api/printers/discover/`, sans JWT), configuration des imprimantes par restaurant (`/api/imprimantes-reseau/`), et envoi de tickets ESC/POS depuis les actions `kitchen/print` et `client/print` sur les commandes.
paths:
  /api/allergens/:
    get:
      operationId: allergens_list
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - allergens
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAllergenList'
          description: ''
    post:
      operationId: allergens_create
      tags:
      - allergens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllergenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllergenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllergenRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allergen'
          description: ''
  /api/allergens/{id}/:
    get:
      operationId: allergens_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this T_HOLLY_PI_ALLERGENS.
        required: true
      tags:
      - allergens
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allergen'
          description: ''
    put:
      operationId: allergens_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this T_HOLLY_PI_ALLERGENS.
        required: true
      tags:
      - allergens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllergenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllergenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllergenRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allergen'
          description: ''
    patch:
      operationId: allergens_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this T_HOLLY_PI_ALLERGENS.
        required: true
      tags:
      - allergens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAllergenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAllergenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAllergenRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allergen'
          description: ''
    delete:
      operationId: allergens_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this T_HOLLY_PI_ALLERGENS.
        required: true
      tags:
      - allergens
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/article-ingredients/:
