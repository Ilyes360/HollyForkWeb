  /api/printers/discover/:
    get:
      operationId: printers_discover_retrieve
      description: 'Scan IPv4 depuis le serveur (ex. Raspberry Pi sur le LAN). Ne
        distingue pas une imprimante d''un autre service : vérifier les IP côté terrain.'
      summary: 'Découverte réseau : candidats sur port TCP brut (ex. 9100)'
      parameters:
      - in: query
        name: include_ap_subnets
        schema:
          type: boolean
        description: 'Si true, ajoute des plages courantes mode point d''accès Wi-Fi
          (ex. 192.168.123.0/24). Par défaut : true (omission ou valeur vide). Passez
          false pour désactiver.'
      - in: query
        name: port
        schema:
          type: integer
        description: Port TCP (défaut 9100).
      - in: query
        name: subnet
        schema:
          type: string
        description: 'CIDR IPv4 (ex. 192.168.1.0/24). Répétable : ?subnet=192.168.1.0/24&subnet=10.0.0.0/24.
          Si omis : tous les /24 locaux dérivés des adresses IPv4 privées des interfaces
          (Linux : `ip -j addr`), avec repli si indisponible.'
      - in: query
        name: timeout_ms
        schema:
          type: integer
        description: Délai max. par tentative de connexion (50–500, défaut 250).
      tags:
      - Impression
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterDiscoverResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterDiscoverError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterDiscoverServerError'
          description: ''
