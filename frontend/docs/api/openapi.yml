        description: A unique integer value identifying this T_HOLLY_PI_ARTICLE_INGREDIENT.
        required: true
      tags:
      - article-ingredients
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleIngredient'
          description: ''
    put:
      operationId: article_ingredients_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this T_HOLLY_PI_ARTICLE_INGREDIENT.
        required: true
      tags:
      - article-ingredients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleIngredientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleIngredientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleIngredientRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleIngredient'
          description: ''
    patch:
      operationId: article_ingredients_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this T_HOLLY_PI_ARTICLE_INGREDIENT.
        required: true
      tags:
