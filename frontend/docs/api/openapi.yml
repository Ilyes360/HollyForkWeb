      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArticleIngredientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArticleIngredientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArticleIngredientRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleIngredient'
          description: ''
    delete:
      operationId: article_ingredients_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this T_HOLLY_PI_ARTICLE_INGREDIENT.
        required: true
      tags:
      - article-ingredients
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/articles/:
