        * `MORNING` - MORNING
        * `AFTERNOON` - AFTERNOON
        * `EVENING` - EVENING
        * `NIGHT` - NIGHT
    UserProfile:
      type: object
      description: Serializer pour le profil utilisateur.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
        email:
          type: string
          format: email
          title: Adresse électronique
          maxLength: 254
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Date d’inscription
        is_active:
          type: boolean
          readOnly: true
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
      required:
      - date_joined
      - id
      - is_active
      - username
    UserRegistrationRequest:
      type: object
      description: Serializer pour l'inscription d'un nouvel utilisateur avec création
        d'employé et PIN code.
      properties:
        username:
          type: string
          minLength: 1
          title: Nom d’utilisateur
          description: Requis. 150 caractères maximum. Uniquement des lettres, nombres
            et les caractères « @ », « . », « + », « - » et « _ ».
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        password2:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        employee_first_name:
          type: string
          minLength: 1
          maxLength: 100
        employee_last_name:
          type: string
          minLength: 1
          maxLength: 100
        pin_code:
          type: string
          minLength: 4
          pattern: ^\d{4}$
          maxLength: 4
        type_employe_id:
          type: integer
          writeOnly: true
        restaurant_id:
          type: integer
          writeOnly: true
          nullable: true
      required:
      - email
      - employee_first_name
      - employee_last_name
      - password
      - password2
      - pin_code
      - type_employe_id
      - username
    UsernamePasswordLoginRequest:
      type: object
      description: |-
        Authentification classique par username + password.
        Retourne les tokens JWT et, si existant, le profil employé de l'utilisateur.
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    ZoneStockage:
