  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: 'Utilisateur authentifié : vérifie l''ancien mot de passe puis
        en définit un nouveau.'
      summary: Changer son mot de passe
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordError'
          description: ''
  /api/auth/csrf-token/:
    get:
      operationId: auth_csrf_token_retrieve
      description: |-
        Récupération du token CSRF.
        Aucune authentification utilisateur requise.
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
          description: ''
  /api/auth/device-login/:
    post:
      operationId: auth_device_login_create
      description: |-
        Connexion d'un équipement (iPad) au restaurant.
        Première étape : ID Restaurant + PIN Restaurant → Device Token
        Aucune authentification utilisateur requise.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLoginValidationErrors'
          description: ''
  /api/auth/forgot-password/:
    post:
      operationId: auth_forgot_password_create
      description: Endpoint public. Envoie un email de reset si le compte existe.
        La réponse est toujours 200 pour ne pas révéler l'existence du compte.
      summary: Demander une réinitialisation de mot de passe
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordError'
          description: ''
  /api/auth/health/:
    get:
      operationId: auth_health_retrieve
      description: |-
        Endpoint de health check simple pour le monitoring.
        Ne nécessite pas d'authentification et renvoie toujours 200 par défaut.
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Authentification classique par username + password → tokens JWT.
        Ne nécessite pas de device_token ni de PIN.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernamePasswordLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UsernamePasswordLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsernamePasswordLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginValidationErrors'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Déconnexion. POST sans body.
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Récupérer le profil de l'utilisateur connecté.
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: auth_profile_partial_update
      description: Mettre à jour partiellement le profil de l'utilisateur.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateValidationErrors'
          description: ''
    delete:
      operationId: auth_profile_destroy
      description: Supprimer le compte de l'utilisateur connecté.
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDeleteResponse'
          description: ''
  /api/auth/quick-login/:
    post:
      operationId: auth_quick_login_create
      description: |-
        Connexion rapide d'un employé avec son PIN.
        Utilise le device_token (restaurant déjà configuré) + PIN employé
        Aucune authentification utilisateur requise.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickLoginRequest'
          application/x-www-form-urlencoded:
            schema:
