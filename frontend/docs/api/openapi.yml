                $ref: '#/components/schemas/RegistrationSuccess'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationErrors'
          description: ''
  /api/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      description: Endpoint public. Valide uid + token (lien email) puis définit le
        nouveau mot de passe.
      summary: Confirmer la réinitialisation de mot de passe
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestRequest'
