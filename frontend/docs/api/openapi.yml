          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickLoginValidationErrors'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Inscription d'un nouvel utilisateur avec création d'employé.
        Aucune authentification utilisateur requise.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
