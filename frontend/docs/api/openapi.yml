  /api/auth/restaurant-employees/:
    get:
      operationId: auth_restaurant_employees_retrieve
      description: |-
        Récupère la liste des employés d'un restaurant après connexion device.
        Utilise le device_token pour identifier le restaurant.
        Aucune authentification utilisateur requise.
      parameters:
      - in: query
        name: device_token
        schema:
          type: string
        description: Token équipement
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantEmployeesResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantEmployeesError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantEmployeesUnauthorized'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/categories/:
    get:
      operationId: categories_list
      description: API endpoint pour gérer les catégories d'articles.
      parameters:
      - in: query
        name: nom
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - categories
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategorieArticleList'
          description: ''
    post:
      operationId: categories_create
      description: API endpoint pour gérer les catégories d'articles.
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorieArticleRequest'
          application/x-www-form-urlencoded:
            schema:
